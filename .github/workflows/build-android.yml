name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Align package versions with the Expo SDK
        run: npx expo install --fix

      - name: Link project to your Expo account (first run only)
        run: eas init --non-interactive --force

      - name: Build the APK on Expo (this waits, about 15-30 minutes)
        run: eas build --platform android --profile preview --non-interactive --json > build.json

      - name: Show build result
        run: cat build.json

      - name: Download the APK as Hanivox.apk
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          echo "Downloading $URL"
          curl -L --fail -o Hanivox.apk "$URL"
          ls -la Hanivox.apk

      - name: Publish Hanivox.apk as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hanivox-build-${{ github.run_number }}
          name: Hanivox build ${{ github.run_number }}
          body: Install Hanivox.apk on your Android phone.
          files: Hanivox.apk

      - name: If the build failed, print the reason from Expo
        if: failure()
        run: |
          echo "Looking up the failed build on Expo..."
          eas build:list --platform android --limit 1 --json --non-interactive > latest.json || true
          jq -r '.[0] | "Build page: https://expo.dev/accounts/\(.project.ownerAccount.name)/projects/\(.project.slug)/builds/\(.id)"' latest.json || true
          for url in $(jq -r '.[0].logFiles[]?' latest.json); do
            echo "=============== LOG FILE ==============="
            curl -sL "$url" > expo-log.txt
            if jq -rR 'fromjson? | .msg // empty' expo-log.txt 2>/dev/null | grep -q .; then
              jq -rR 'fromjson? | .msg // empty' expo-log.txt | tail -n 150
            else
              tail -n 150 expo-log.txt
            fi
          done
