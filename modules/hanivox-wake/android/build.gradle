plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.hanivoxwake'
version = '0.1.0'

android {
  namespace "expo.modules.hanivoxwake"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'net.java.dev.jna:jna:5.13.0@aar'
  implementation 'com.alphacephei:vosk-android:0.3.47'
}
